name: Docker Build, Push, and Run

on:
  push:
    branches: ["init"]

jobs:
  build-push-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/crypto-trader:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/crypto-trader:${{ github.run_number }}
      
      - name: Run Docker container
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/crypto-trader:latest
          docker run -d \
            --name crypto-trader-container \
            -p 3000:3000 \
            ${{ secrets.DOCKER_HUB_USERNAME }}/crypto-trader:latest
      
      - name: Check container status
        run: |
          docker ps
          echo "Container logs:"
          docker logs crypto-trader-container